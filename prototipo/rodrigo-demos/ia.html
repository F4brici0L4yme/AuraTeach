<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Demo tutor IA</title><style>body{font:16px/1.5 Arial;max-width:720px;margin:32px auto;padding:0 18px;color:#222}textarea,input,button{padding:10px;margin:6px 0}textarea{display:block;width:min(100%,600px);height:90px}#answer{margin-top:18px;padding:14px;background:#f2f2f2;white-space:pre-wrap}</style><h1>Interfaz con API de IA</h1><label>Tema <input id="topic" value="Ingeniería ambiental"></label><textarea id="question" placeholder="Escribe una pregunta"></textarea><button id="ask">Preguntar al tutor</button><span id="state"></span><div id="answer">Respuesta aparecerá aquí.</div><script>document.querySelector('#ask').onclick=async()=>{const state=document.querySelector('#state'),answer=document.querySelector('#answer');state.textContent=' Consultando…';try{const r=await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:document.querySelector('#question').value,topic:document.querySelector('#topic').value})}),d=await r.json();answer.textContent=d.answer||d.error;state.textContent=d.mode==='simulated'?' · respuesta simulada':' · respuesta del modelo'}catch{answer.textContent='No se pudo conectar al servidor local.';state.textContent=''}};</script></html>
