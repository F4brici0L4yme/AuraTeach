<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Demo voz celular-servidor</title><style>body{font:16px/1.5 Arial;max-width:700px;margin:32px auto;padding:0 18px;color:#222}textarea,button{padding:10px;margin:6px 0}textarea{display:block;width:min(100%,600px);height:90px}#result{padding:12px;background:#f3f3f3}</style><h1>Micrófono del teléfono → servidor</h1><p>Dicta una pregunta o escríbela como alternativa.</p><button id="record">🎙 Dictar</button><textarea id="text" placeholder="Transcripción o pregunta escrita"></textarea><button id="send">Enviar pregunta al servidor</button><p id="result" aria-live="polite">Esperando pregunta.</p><script>const text=document.querySelector('#text');document.querySelector('#record').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.querySelector('#result').textContent='Reconocimiento de voz no disponible; escribe la pregunta.';return}const r=new SR();r.lang='es-PE';r.onresult=e=>text.value=e.results[0][0].transcript;r.onerror=()=>document.querySelector('#result').textContent='No se pudo usar el micrófono; escribe la pregunta.';r.start()};document.querySelector('#send').onclick=async()=>{try{const r=await fetch('/api/events',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'voice-question',question:text.value,source:'phone'})}),d=await r.json();document.querySelector('#result').textContent=d.ok?`Servidor recibió: ${d.event.question}`:'No se pudo enviar.'}catch{document.querySelector('#result').textContent='No se pudo conectar al servidor.'}};</script></html>
