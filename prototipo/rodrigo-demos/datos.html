<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Demo accesibilidad y datos</title><style>body{font:16px/1.5 Arial;max-width:720px;margin:32px auto;padding:0 18px;color:#222}.large{font-size:21px}button,input{padding:9px;margin:5px}li{margin:8px 0}</style><h1>Accesibilidad y datos</h1><button id="size">Cambiar tamaño de texto</button><label><input type="checkbox" id="contrast"> Alto contraste</label><p id="content">Registro simple de interacciones de una sesión.</p><input id="event" placeholder="Describe un hallazgo"><button id="save">Registrar hallazgo</button><button id="export">Exportar CSV</button><ul id="list"></ul><p>Los datos de esta demo se guardan en localStorage en este navegador.</p><script>let items=JSON.parse(localStorage.getItem('demoEvents')||'[]');const p=document.querySelector('#content');function render(){document.querySelector('#list').innerHTML=items.map(x=>`<li>${x.time} · ${x.text}</li>`).join('')}document.querySelector('#size').onclick=()=>p.classList.toggle('large');document.querySelector('#contrast').onchange=e=>document.body.style.background=e.target.checked?'#111':'white';document.querySelector('#save').onclick=()=>{const text=document.querySelector('#event').value.trim();if(!text)return;items.push({time:new Date().toLocaleTimeString(),text});localStorage.setItem('demoEvents',JSON.stringify(items));render()};document.querySelector('#export').onclick=()=>{const csv='hora,hallazgo\n'+items.map(x=>`"${x.time}","${x.text.replaceAll('"','""')}"`).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='hallazgos-demo.csv';a.click()};render()</script></html>
