<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Demo Auth</title><style>body{font:16px Arial;max-width:600px;margin:35px auto;padding:0 18px;color:#222}label,input,select,button{display:block;margin:10px 0}input,select,button{padding:9px}section{border:1px solid #ccc;padding:16px;border-radius:6px}</style><h1>Autenticación · demo</h1><section id="form"><label>Alias<input id="name" value="Estudiante 01"></label><label>Rol<select id="role"><option>Estudiante</option><option>Docente</option></select></label><button id="login">Iniciar sesión de muestra</button></section><section id="active" hidden><p id="status"></p><button id="logout">Cerrar sesión</button></section><p>Solo simula una identidad en este navegador; no crea cuentas ni contraseñas.</p><script>const f=document.querySelector('#form'),a=document.querySelector('#active');function paint(){const s=JSON.parse(sessionStorage.getItem('demoUser')||'null');f.hidden=!!s;a.hidden=!s;if(s)document.querySelector('#status').textContent=`Sesión de muestra: ${s.name} · ${s.role}`}document.querySelector('#login').onclick=()=>{sessionStorage.setItem('demoUser',JSON.stringify({name:document.querySelector('#name').value,role:document.querySelector('#role').value}));paint()};document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('demoUser');paint()};paint()</script></html>
