<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Demo Canvas GLB</title><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script><style>body{font:16px Arial;max-width:850px;margin:30px auto;padding:0 18px;color:#222}model-viewer{width:100%;height:65vh;min-height:360px;background:#f1f3f1}button,input{padding:9px;margin:8px 0}#markers li{margin:6px}.commands{border:1px solid #ccc;border-radius:6px;padding:12px;margin:14px 0}.commands h2{font-size:18px;margin:0 0 5px}#command-status{font-family:monospace;color:#444}</style></head><body><h1>Canvas GLB</h1><p>Carga un GLB propio o abre el modelo de muestra. Arrastra el modelo para rotar y usa la rueda para acercar.</p><input type="file" id="file" accept=".glb"><button id="sample">Abrir modelo de muestra</button><model-viewer id="viewer" src="../../9_13_2025.glb" camera-controls shadow-intensity=".5" alt="Modelo GLB"></model-viewer><section class="commands"><h2>Prueba de comandos (simulados)</h2><p>Estos botones prueban las acciones que luego podrá enviar YOLO.</p><button data-command="rotate">Rotar</button><button data-command="select">Seleccionar centro</button><button data-command="reset">Restablecer vista</button><p id="command-status" aria-live="polite">Esperando un comando. La fuente actual es simulada.</p></section><h2>Marcadores</h2><ul id="markers"></ul><script>
const v=document.querySelector('#viewer');
document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(f)v.src=URL.createObjectURL(f)};
document.querySelector('#sample').onclick=()=>v.src='../../9_13_2025.glb';
let n=0;
function addMarker(){const p=v.positionAndNormalFromPoint(v.clientWidth/2,v.clientHeight/2);if(!p){document.querySelector('#command-status').textContent='No se pudo seleccionar: espera a que cargue el modelo y vuelve a intentarlo.';return false}const b=document.createElement('button');b.slot=`hotspot-${++n}`;b.dataset.position=p.position.toString();b.dataset.normal=p.normal.toString();b.textContent=`P${n}`;b.setAttribute('aria-label',`Punto de interés ${n}`);b.style.cssText='background:#fff;border:2px solid #174ea6;border-radius:50%;padding:5px';v.append(b);const li=document.createElement('li');li.textContent=`P${n}: marcador añadido al centro del visor`;document.querySelector('#markers').append(li);return true}
window.dispatchCanvasCommand=function(command){const status=document.querySelector('#command-status');if(command==='rotate'){v.cameraOrbit='45deg 75deg 2m';status.textContent='Comando recibido: rotate · vista del modelo cambiada.';return true}if(command==='select'){const ok=addMarker();if(ok)status.textContent='Comando recibido: select · marcador añadido.';return ok}if(command==='reset'){v.cameraOrbit='auto auto auto';v.cameraTarget='auto auto auto';status.textContent='Comando recibido: reset · vista restablecida.';return true}status.textContent=`Comando no reconocido: ${command}`;return false};
document.querySelectorAll('[data-command]').forEach(b=>b.addEventListener('click',()=>window.dispatchCanvasCommand(b.dataset.command)));
</script></body></html>
