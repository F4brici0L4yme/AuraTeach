<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Demo MCP live</title><style>body{font:16px/1.5 Arial;max-width:700px;margin:32px auto;padding:0 18px;color:#222}input,button{padding:10px;margin:6px 0}pre{white-space:pre-wrap;background:#f3f3f3;padding:14px}</style><h1>MCP · interacción live</h1><p>Esta demo llama la herramienta <code>record_observation</code> del servidor MCP local.</p><input id="observation" value="Observo una textura diferente en esta parte"><button id="call">Registrar observación</button><pre id="result">Sin llamadas todavía.</pre><script>let id=0;document.querySelector('#call').onclick=async()=>{const out=document.querySelector('#result');try{const r=await fetch('/mcp',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:++id,method:'tools/call',params:{name:'record_observation',arguments:{observation:document.querySelector('#observation').value,topic:'demo GLB'}}})}),d=await r.json();out.textContent=JSON.stringify(d.result?.structuredContent||d.result?.content||d.error,null,2)}catch{out.textContent='No se pudo conectar al endpoint MCP local.'}};</script></html>
